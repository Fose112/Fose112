    // Helper for rendering Lucide icons safely without React virtual DOM collisions
    const Icon = ({ name, className = "w-4 h-4", ...props }) => {
      const spanRef = useRef(null);

      useEffect(() => {
        if (!spanRef.current) return;
        try {
          if (window.lucide && window.lucide.icons) {
            const pascalName = name
              .split('-')
              .map(part => part.charAt(0).toUpperCase() + part.slice(1))
              .join('');
            
            const iconObj = window.lucide.icons[pascalName] || window.lucide.icons[name];
            if (iconObj && typeof window.lucide.createElement === 'function') {
              const svg = window.lucide.createElement(iconObj);
              svg.setAttribute('class', className);
              spanRef.current.innerHTML = '';
              spanRef.current.appendChild(svg);
              return;
            }
          }

          if (window.lucide && typeof window.lucide.createIcons === 'function') {
            spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
            window.lucide.createIcons({ root: spanRef.current });
          }
        } catch (err) {
          console.warn("Icon render error:", err);
        }
      }, [name, className]);

      return <span ref={spanRef} className="inline-flex items-center justify-center flex-shrink-0" {...props}></span>;
    };

    // Client-side lightweight image compression
    const compressImageFile = (file, maxWidth = 1600, quality = 0.82) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            const compressedDataUrl = canvas.toDataURL("image/jpeg", quality);
            resolve(compressedDataUrl);
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    };

    const ImageUploadInput = ({ label, value, onChange, placeholder = "Upload file or paste image URL..." }) => {
      const [isDragging, setIsDragging] = useState(false);
      const [isProcessing, setIsProcessing] = useState(false);
      const fileInputRef = useRef(null);

      const handleFiles = async (files) => {
        if (!files || files.length === 0) return;
        const file = files[0];
        if (!file.type.startsWith("image/")) return;

        try {
          setIsProcessing(true);
          const compressed = await compressImageFile(file, 1600, 0.82);
          onChange(compressed);
        } catch (error) {
          console.error("Image processing error", error);
        } finally {
          setIsProcessing(false);
        }
      };

      return (
        <div className="space-y-1.5">
          {label && <label className="block text-xs font-semibold text-slate-700">{label}</label>}
          <div 
            onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
            onDragLeave={() => setIsDragging(false)}
            onDrop={(e) => {

              setIsDragging(false);
              handleFiles(e.dataTransfer.files);

    const MultiImageGalleryUploader = ({ gallery = [], onChange }) => {
      const fileInputRef = useRef(null);
      const [newUrlInput, setNewUrlInput] = useState("");

      const handleBatchFiles = async (files) => {
        if (!files || files.length === 0) return;
        const newImages = [];

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          if (file.type.startsWith("image/")) {
            try {
              const compressed = await compressImageFile(file, 1600, 0.82);
              newImages.push(compressed);
            } catch (err) {
              console.error("Batch file error", err);
            }
          }
        }

        if (newImages.length > 0) {
          onChange([...gallery, ...newImages]);
        }

        onChange([...gallery, newUrlInput.trim()]);

              className="px-3 py-1 bg-sand-500 hover:bg-sand-600 text-obsidian-950 font-semibold text-xs rounded-lg flex items-center space-x-1.5 shadow-sm transition"
            >
              <Icon name="plus" className="w-3.5 h-3.5" />
              <span>Add Images</span>
            </button>
            <input 
              type="file" 
              ref={fileInputRef} 
              multiple 
              accept="image/*" 
              className="hidden" 
              onChange={(e) => handleBatchFiles(e.target.files)} 
            />
          </div>

          <div 
            onDragOver={(e) => e.preventDefault()}
            onDrop={(e) => {
              e.preventDefault();
              handleBatchFiles(e.dataTransfer.files);
            }}
            className="border-2 border-dashed border-slate-200 rounded-xl p-3 bg-slate-50/50"
          >
            {gallery.length === 0 ? (
              <div

                className="py-6 text-center cursor-pointer text-slate-400 hover:text-slate-600"

              <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-3">

                    <span className="absolute top-1 left-1 bg-obsidian-900/80 text-[9px] font-bold text-white px-1.5 py-0.5 rounded">
                      #{idx + 1}
                    </span>
                    <button
                      type="button"
                      onClick={() => handleRemove(idx)}
                      className="absolute top-1 right-1 bg-rose-600 text-white p-1 rounded-full opacity-80 group-hover:opacity-100 hover:bg-rose-700 transition"
                      title="Delete photo"
                    >
                      <Icon name="trash-2" className="w-3 h-3" />
                    </button>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="flex space-x-2">
            <input 
              type="text" 
              placeholder="Or add single image by Web URL..."
              value={newUrlInput}
              onChange={(e) => setNewUrlInput(e.target.value)}
              className="flex-1 text-xs px-3 py-1.5 bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-sand-400"
            />
            <button
              type="button"
              onClick={handleAddUrl}
              className="px-3 py-1.5 bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold rounded-lg"
            >
              Add URL
            </button>
          </div>
        </div>
      );
    };

    function App() {
      const [lang, setLang] = useState("en");
      const t = I18N[lang];

      const [currency, setCurrency] = useState("THB");
      const currencyRates = { THB: 1, USD: 0.029, EUR: 0.027 };
      const currencySymbols = { THB: "฿", USD: "$", EUR: "€" };

      const [properties, setProperties] = useState(() => {
        try {
          const saved = localStorage.getItem("luxury_properties_v2");
          return saved ? JSON.parse(saved) : DEFAULT_PROPERTIES;
        } catch {
          return DEFAULT_PROPERTIES;
        }
      });

      const [siteSettings, setSiteSettings] = useState(() => {
        try {
          const saved = localStorage.getItem("luxury_site_settings");
          return saved ? { ...DEFAULT_SITE_SETTINGS, ...JSON.parse(saved) } : DEFAULT_SITE_SETTINGS;
        } catch {
          return DEFAULT_SITE_SETTINGS;
        }
      });

      const [admins, setAdmins] = useState(() => {
        try {
          const saved = localStorage.getItem("luxury_admin_users");
          return saved ? JSON.parse(saved) : INITIAL_ADMINS;
        } catch {
          return INITIAL_ADMINS;
        }
      });

      const [favorites, setFavorites] = useState(() => {
        try {
          const saved = localStorage.getItem("luxury_favorites");
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });

      // Filter states
      const [filterLocation, setFilterLocation] = useState("all");
      const [filterType, setFilterType] = useState("all");
      const [filterBeds, setFilterBeds] = useState("all");
      const [filterPets, setFilterPets] = useState("all");
      const [filterMaxPrice, setFilterMaxPrice] = useState(500000);
      const [searchQuery, setSearchQuery] = useState("");
      const [onlyFavorites, setOnlyFavorites] = useState(false);
      const [rentalTerm, setRentalTerm] = useState("monthly");

      // Modals
      const [selectedProperty, setSelectedProperty] = useState(null);
      const [inquiryProperty, setInquiryProperty] = useState(null);
      const [lightboxImage, setLightboxImage] = useState(null);
      const [showAdminPortal, setShowAdminPortal] = useState(false);
      const [toastMsg, setToastMsg] = useState("");

      useEffect(() => {
        localStorage.setItem("luxury_properties_v2", JSON.stringify(properties));
      }, [properties]);

      useEffect(() => {
        localStorage.setItem("luxury_site_settings", JSON.stringify(siteSettings));
      }, [siteSettings]);

      useEffect(() => {
        localStorage.setItem("luxury_admin_users", JSON.stringify(admins));
      }, [admins]);

      useEffect(() => {
        localStorage.setItem("luxury_favorites", JSON.stringify(favorites));
      }, [favorites]);

      // Keyboard & Hash routing for admin console
      useEffect(() => {
        const checkHash = () => {
          const hash = window.location.hash.toLowerCase();
          if (hash === "#/portal-login" || hash === "#/secret-console" || hash === "#/admin") {
            setShowAdminPortal(true);
          }
        };
        checkHash();
        window.addEventListener("hashchange", checkHash);

        const handleKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'a' || e.key === 'A')) {
            e.preventDefault();
            setShowAdminPortal(prev => !prev);
          }
        };
        window.addEventListener("keydown", handleKeyDown);

        return () => {
          window.removeEventListener("hashchange", checkHash);
          window.removeEventListener("keydown", handleKeyDown);
        };
      }, []);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(""), 3500);
      };

      const toggleFavorite = (id, e) => {
        if (e) e.stopPropagation();
        setFavorites(prev => {
          const next = prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id];
          showToast(next.includes(id) ? "Saved to your private wish list" : "Removed from wish list");
          return next;
        });
      };

      const formatPrice = (valInThb) => {
        const converted = Math.round(valInThb * currencyRates[currency]);
        return `${currencySymbols[currency]} ${converted.toLocaleString()}`;
      };

      const filteredProperties = useMemo(() => {
        return properties.filter(item => {
          if (onlyFavorites && !favorites.includes(item.id)) return false;
          if (filterLocation !== "all" && !item.location.toLowerCase().includes(filterLocation.toLowerCase())) return false;
          if (filterType !== "all" && item.type.toLowerCase() !== filterType.toLowerCase()) return false;
          if (filterBeds !== "all" && item.bedrooms < parseInt(filterBeds)) return false;
          if (filterPets === "pets-only" && !item.petsAllowed) return false;
          
          const comparePrice = rentalTerm === "monthly" ? item.priceMonthly : item.priceNightly * 30;
          if (comparePrice > filterMaxPrice) return false;

          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchTitle = item.title.toLowerCase().includes(q) || (item.titleTh && item.titleTh.toLowerCase().includes(q));
            const matchLoc = item.location.toLowerCase().includes(q);
            const matchDesc = item.description.toLowerCase().includes(q);
            if (!matchTitle && !matchLoc && !matchDesc) return false;
          }
          return true;
        });
      }, [properties, favorites, onlyFavorites, filterLocation, filterType, filterBeds, filterPets, filterMaxPrice, searchQuery, rentalTerm]);

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900 relative">
          
          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-[100] bg-obsidian-950 text-sand-200 px-5 py-3 rounded-xl shadow-2xl border border-sand-500/40 flex items-center space-x-3 text-xs tracking-wide">
              <span className="w-2 h-2 rounded-full bg-emerald-400"></span>

                    >

                          </div>

                          <div className="pt-2 border-t border-slate-200">
                            <span className="text-[11px] font-semibold text-slate-600 uppercase tracking-wider block mb-1">
                              หรือพิมพ์สิ่งอำนวยความสะดวกเพิ่มเติมที่ไม่มีในตัวเลือก:
                            </span>
                            <div className="flex space-x-2">
                              <input 
                                type="text"
                                placeholder="พิมพ์ชื่อ เช่น 'Helipad Access', 'Cinema Room', 'Sauna Room' แล้วกด Add..."
                                value={customAmenityInput}
                                onChange={(e) => setCustomAmenityInput(e.target.value)}
                                onKeyDown={(e) => {
                                  if (e.key === 'Enter') {
                                    e.preventDefault();
                                    handleAddCustomAmenity();
                                  }
                                }}
                                className="flex-1 px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs focus:ring-1 focus:ring-sand-400 focus:outline-none"
                              />
                              <button
                                type="button"
                                onClick={handleAddCustomAmenity}
                                className="px-4 py-2 bg-obsidian-900 text-sand-300 hover:bg-obsidian-800 rounded-lg text-xs font-semibold flex items-center space-x-1 shadow transition"
                              >
                                <Icon name="plus" className="w-3.5 h-3.5" />
                                <span>เพิ่ม (Add)</span>
                              </button>
                            </div>
                          </div>

                          {(formData.amenities && formData.amenities.length > 0) && (
                            <div className="pt-2">
                              <span className="text-[11px] font-semibold text-slate-600 uppercase tracking-wider block mb-1.5">
                                สิ่งอำนวยความสะดวกที่จะแสดงในบ้านหลังนี้:
                              </span>
                              <div className="flex flex-wrap gap-1.5">
                                {formData.amenities.map((item, idx) => (
                                  <span 
                                    key={idx}
                                    className="inline-flex items-center space-x-1.5 px-2.5 py-1 rounded-md bg-white border border-sand-300 text-sand-900 text-xs font-medium shadow-sm"
                                  >
                                    <span>{item}</span>
                                    <button
                                      type="button"
                                      onClick={() => handleRemoveAmenity(item)}
                                      className="text-slate-400 hover:text-rose-600 ml-1 font-bold"
                                      title="Remove"
                                    >
                                      ×
                                    </button>
                                  </span>
                                ))}
                              </div>
                            </div>
                          )}
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Description Narrative (รายละเอียดคำอธิบาย)</label>
                          <textarea 
                            rows="3"
                            value={formData.description}
                            onChange={(e) => setFormData({...formData, description: e.target.value})}
                            className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs"
                          ></textarea>
                        </div>

                        <div className="flex justify-end space-x-3 pt-4 border-t border-slate-200">
                          <button
                            type="button"
                            onClick={() => setAdminTab("properties")}
                            className="px-4 py-2 border border-slate-200 text-slate-600 text-xs font-semibold rounded-xl hover:bg-slate-100 transition"
                          >
                            ยกเลิก (Cancel)
                          </button>
                          <button
                            type="submit"
                            className="px-6 py-2 bg-obsidian-950 hover:bg-slate-800 text-sand-300 text-xs font-bold uppercase tracking-wider rounded-xl shadow transition"
                          >
                            บันทึกอสังหาฯ (Save Residence)
                          </button>
                        </div>
                      </form>
                    </div>
                  )}

                  {/* TAB 4: VISITOR ANALYTICS */}
                  {adminTab === "analytics" && (
                    <div className="space-y-6">
                      <div>
                        <h4 className="font-serif text-xl font-bold text-obsidian-950">Concierge Desk Analytics</h4>
                        <p className="text-xs text-slate-500 mt-1">สถิติผู้เข้าชมและการคลิกดูบ้านพักพูลวิลล่าและคอนโดแต่ละหลัง</p>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                          <span className="text-xs font-semibold uppercase text-slate-400">Total Portfolio Views</span>
                          <p className="text-2xl font-serif font-bold text-obsidian-950 mt-1">
                            {properties.reduce((acc, p) => acc + (p.viewsCount || 0), 0).toLocaleString()}
                          </p>
                        </div>

                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                          <span className="text-xs font-semibold uppercase text-slate-400">Listed Residences</span>
                          <p className="text-2xl font-serif font-bold text-obsidian-950 mt-1">
                            {properties.length}
                          </p>
                        </div>

                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                          <span className="text-xs font-semibold uppercase text-slate-400">Active Concierge Admins</span>
                          <p className="text-2xl font-serif font-bold text-sand-600 mt-1">
                            {admins.length}
                          </p>
                        </div>
                      </div>

                      <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                        <h5 className="font-serif font-bold text-slate-800 text-sm mb-3">Property Interest Leaderboard (ยอดวิวแต่ละหลัง)</h5>
                        <div className="space-y-3">
                          {properties.map(item => (
                            <div key={item.id} className="flex items-center justify-between text-xs py-2 border-b border-slate-100 last:border-none">
                              <div>
                                <span className="font-semibold text-slate-800">{item.title}</span>
                                <span className="text-slate-400 ml-2">({item.location})</span>
                              </div>
                              <span className="font-bold text-slate-900 bg-sand-50 px-2.5 py-1 rounded border border-sand-200">
                                {item.viewsCount || 0} views
                              </span>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}

                  {/* TAB 5: STAFF ROLES & ADMIN ACCOUNTS */}
                  {adminTab === "admins" && (
                    <div className="space-y-6 max-w-2xl">
                      <div>
                        <h4 className="font-serif text-xl font-bold text-obsidian-950">Concierge Desk Staff Accounts</h4>
                        <p className="text-xs text-slate-500 mt-1">จัดการรายชื่อผู้ดูแลและเจ้าหน้าที่ Concierge ที่มีสิทธิ์แก้ไขข้อมูล</p>
                      </div>

                      <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-4 shadow-sm">
                        <h5 className="text-xs font-bold uppercase tracking-wider text-slate-700">Add New Team Member (เพิ่มผู้ดูแลใหม่)</h5>
                        <form onSubmit={handleAddAdmin} className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                          <input 
                            type="text"
                            required
                            placeholder="Full Name"
                            value={newAdminName}
                            onChange={(e) => setNewAdminName(e.target.value)}
                            className="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs"
                          />
                          <input 
                            type="email"
                            required
                            placeholder="Work Email"
                            value={newAdminEmail}
                            onChange={(e) => setNewAdminEmail(e.target.value)}
                            className="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs"
                          />
                          <button
                            type="submit"
                            className="px-4 py-2 bg-obsidian-950 text-sand-300 font-bold text-xs rounded-lg shadow hover:bg-slate-800 transition"
                          >
                            Grant Access
                          </button>
                        </form>
                      </div>

                      <div className="bg-white rounded-2xl border border-slate-200 divide-y divide-slate-100 shadow-sm">
                        {admins.map(adm => (
                          <div key={adm.id} className="p-4 flex items-center justify-between">
                            <div>
                              <p className="text-xs font-bold text-slate-800">{adm.name}</p>
                              <p className="text-[11px] text-slate-500">{adm.email} • <span className="text-sand-700 font-medium">{adm.role}</span></p>
                            </div>
                            {admins.length > 1 && (
                              <button
                                type="button"
                                onClick={() => {
                                  setAdmins(prev => prev.filter(a => a.id !== adm.id));
                                  showToast("Admin account revoked");
                                }}
                                className="text-xs text-rose-500 hover:text-rose-700 transition"
                              >
                                Revoke
                              </button>
                            )}
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
